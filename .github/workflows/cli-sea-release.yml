name: Attach CLI SEA Binaries

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the CLI binaries to'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build CLI SEA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: nike-release-checker-macos-arm64
            path: packages/cli/dist/nike-release-checker-macos-arm64
          - os: windows-latest
            artifact: nike-release-checker-win-x64.exe
            path: packages/cli/dist/nike-release-checker-win-x64.exe
          - os: ubuntu-latest
            artifact: nike-release-checker-linux-x64
            path: packages/cli/dist/nike-release-checker-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release is CLI
        id: ensure_release
        uses: ./.github/composite-actions/ensure-release-package
        with:
          package: cli
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install
        if: steps.ensure_release.outputs.should_skip != 'true'
        uses: ./.github/composite-actions/install

      - name: Build SEA
        if: steps.ensure_release.outputs.should_skip != 'true'
        working-directory: packages/cli
        run: npm run build:sea

      - name: Upload build artifact
        if: steps.ensure_release.outputs.should_skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  upload:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release is CLI
        id: ensure_release
        uses: ./.github/composite-actions/ensure-release-package
        with:
          package: cli
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Download artifacts
        if: steps.ensure_release.outputs.should_skip != 'true'
        uses: actions/download-artifact@v8
        with:
          path: downloads
          merge-multiple: true

      - name: Package binaries
        if: steps.ensure_release.outputs.should_skip != 'true'
        run: |
          chmod +x downloads/nike-release-checker-macos-arm64
          tar -czf downloads/nike-release-checker-macos-arm64.tar.gz -C downloads nike-release-checker-macos-arm64
          chmod +x downloads/nike-release-checker-linux-x64
          tar -czf downloads/nike-release-checker-linux-x64.tar.gz -C downloads nike-release-checker-linux-x64

      - name: Upload release assets
        if: steps.ensure_release.outputs.should_skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            downloads/nike-release-checker-macos-arm64.tar.gz
            downloads/nike-release-checker-linux-x64.tar.gz
            downloads/nike-release-checker-linux-x64
            downloads/nike-release-checker-win-x64.exe
